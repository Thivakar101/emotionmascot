<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emotion Mascot</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1b1b23;
        --muted: #666978;
        --panel: #ffffff;
        --line: #dfe3ea;
        --accent: #246bfe;
        --accent-ink: #ffffff;
        --page: #f3f5f8;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
      }

      body {
        margin: 0;
        height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.8), transparent 44%),
          var(--page);
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden; /* page itself never scrolls */
      }

      main {
        width: min(100%, 1180px);
        height: min(100%, 760px);
        margin: 0 auto;
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        grid-template-rows: minmax(0, 1fr);
        gap: 18px;
        min-height: 0;
      }

      .stage {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 0;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        box-shadow: 0 18px 50px rgba(35, 43, 70, 0.12);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        /* Keep the face and upper torso visible; the lower body is intentionally cropped. */
        clip-path: inset(0 0 42% 0);
        transform: translate(var(--mascot-x, 0px), var(--mascot-y, 0px));
        transition: transform 180ms ease-out;
      }

      .position-box {
        position: absolute;
        right: 18px;
        bottom: 18px;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(3, 42px);
        gap: 5px;
        padding: 8px;
        border: 1px solid rgba(36, 107, 254, 0.26);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 10px 24px rgba(35, 43, 70, 0.16);
        backdrop-filter: blur(8px);
      }

      .position-box__label {
        grid-column: 1 / -1;
        margin: 0 0 1px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }

      .position-button {
        display: grid;
        width: 42px;
        min-height: 38px;
        padding: 0;
        place-items: center;
        border-radius: 8px;
        font-size: 20px;
        line-height: 1;
      }

      .position-button--up { grid-column: 2; grid-row: 2; }
      .position-button--left { grid-column: 1; grid-row: 3; }
      .position-button--down { grid-column: 2; grid-row: 3; }
      .position-button--right { grid-column: 3; grid-row: 3; }
      }

      .panel {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panel-heading {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.01em;
      }

      .when-button {
        min-height: 34px;
        padding: 0 12px;
        border-color: #bfd0ff;
        background: #edf3ff;
        color: #174eb8;
        font-size: 13px;
      }

      .emotion-detail {
        min-height: 112px;
        padding: 13px 14px;
        border: 1px solid #d9e3ff;
        border-radius: 8px;
        background: linear-gradient(145deg, #ffffff, #f3f7ff);
        box-shadow: 0 8px 22px rgba(36, 107, 254, 0.08);
        flex: 0 0 auto;
      }

      .emotion-detail-label {
        margin: 0 0 4px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .emotion-detail h2 {
        margin: 0 0 5px;
        font-size: 16px;
        line-height: 1.25;
      }

      .emotion-detail p:last-child {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .controls {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        display: grid;
        grid-template-columns: 1fr;
        align-content: start;
        gap: 10px;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .emotion-button {
        min-width: 0;
        min-height: 58px;
        padding: 9px 12px;
        text-align: left;
      }

      .emotion-number,
      .emotion-name {
        display: block;
      }

      .emotion-number {
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .emotion-name {
        overflow: hidden;
        font-size: 13px;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .emotion-button[aria-pressed="true"] .emotion-number {
        color: rgba(255, 255, 255, 0.72);
      }

      button {
        appearance: none;
        position: relative;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
        color: var(--ink);
        min-height: 48px;
        padding: 0 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
        transition:
          background 160ms ease,
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      button:hover,
      button:focus-visible {
        border-color: var(--accent);
        outline: none;
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
        transform: none;
      }

      button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      button[data-new="true"]::after {
        content: "NEW";
        position: absolute;
        top: -9px;
        right: 12px;
        min-width: 38px;
        padding: 3px 7px;
        border-radius: 999px;
        background: #ffcf33;
        color: #2a2100;
        font-size: 11px;
        font-weight: 900;
        line-height: 1;
        box-shadow: 0 5px 14px rgba(79, 61, 0, 0.18);
        transform: scale(0.92);
        transform-origin: center;
        transition: transform 160ms ease;
      }

      button[data-new="true"]:hover::after,
      button[data-new="true"]:focus-visible::after {
        transform: scale(1);
      }

      .status {
        min-height: 20px;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        flex: 0 0 auto;
      }

      dialog {
        width: min(720px, calc(100% - 32px));
        max-height: min(760px, calc(100% - 32px));
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--ink);
        background: var(--panel);
        box-shadow: 0 28px 80px rgba(20, 28, 50, 0.26);
      }

      dialog::backdrop {
        background: rgba(20, 28, 50, 0.48);
        backdrop-filter: blur(3px);
      }

      .guide-header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
      }

      .guide-header h2 {
        margin: 0 0 2px;
        font-size: 19px;
      }

      .guide-header p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .close-button {
        min-width: 36px;
        min-height: 36px;
        padding: 0;
        border-radius: 999px;
        font-size: 20px;
        line-height: 1;
      }

      .guide-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        max-height: calc(min(760px, 100vh - 32px) - 82px);
        margin: 0;
        padding: 16px 20px 20px;
        overflow-y: auto;
        list-style: none;
      }

      .guide-item {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
      }

      .guide-item strong {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
        line-height: 1.3;
      }

      .guide-item span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      @media (max-width: 640px) {
        body {
          display: block;
          min-height: 100dvh;
          height: auto;
          padding: 12px;
          overflow: auto;
        }

        main {
          width: 100%;
          height: auto;
          min-height: calc(100dvh - 24px);
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: clamp(340px, 54dvh, 560px) auto;
          gap: 12px;
        }

        .stage {
          min-height: 0;
        }

        canvas {
          height: 100%;
        }

        .position-box {
          right: 12px;
          bottom: 12px;
          grid-template-columns: repeat(3, 44px);
          gap: 4px;
          padding: 7px;
        }

        .position-button {
          width: 44px;
          min-height: 44px;
        }

        .panel {
          gap: 8px;
          overflow: visible;
        }

        .panel-heading {
          font-size: 16px;
        }

        .controls {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          flex: none;
          max-height: none;
          overflow: visible;
        }

        .emotion-detail {
          min-height: 96px;
        }

        .guide-list {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 380px) {
        .position-box {
          right: 8px;
          bottom: 8px;
          grid-template-columns: repeat(3, 40px);
          padding: 6px;
        }

        .position-button {
          width: 40px;
          min-height: 40px;
        }

        .when-button {
          padding: 0 10px;
        }

        .emotion-button {
          min-height: 54px;
          padding: 8px 10px;
        }
      }

      @media (max-width: 640px) and (orientation: landscape) {
        main {
          grid-template-rows: minmax(300px, 82dvh) auto;
        }
      }

      @media (min-width: 641px) and (max-width: 900px) {
        main {
          grid-template-columns: minmax(0, 1fr) 280px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="stage" aria-label="Mascot preview">
        <canvas id="mascot" width="1200" height="800"></canvas>
        <div class="position-box" aria-label="Move mascot">
          <p class="position-box__label">Move mascot</p>
          <button class="position-button position-button--up" type="button" data-direction="up" aria-label="Move mascot up">↑</button>
          <button class="position-button position-button--left" type="button" data-direction="left" aria-label="Move mascot left">←</button>
          <button class="position-button position-button--down" type="button" data-direction="down" aria-label="Move mascot down">↓</button>
          <button class="position-button position-button--right" type="button" data-direction="right" aria-label="Move mascot right">→</button>
        </div>
      </section>

      <div class="panel">
        <div class="panel-header">
          <h1 class="panel-heading">Mascot animations</h1>
          <button class="when-button" id="open-guide" type="button" aria-label="See when to use each animation">When</button>
        </div>

        <section class="emotion-detail" id="emotion-detail" aria-live="polite">
          <p class="emotion-detail-label">Animation guide</p>
          <h2 id="detail-title">Choose an emotion</h2>
          <p id="detail-description">Select an animation to see when it should be used.</p>
        </section>

        <section class="controls" id="emotion-controls" aria-label="Emotion controls"></section>

        <div class="status" id="status" role="status">Loading mascot...</div>
      </div>
    </main>

    <dialog id="usage-guide" aria-labelledby="guide-title">
      <div class="guide-header">
        <div>
          <h2 id="guide-title">Mascot animations</h2>
          <p>When to use each emotion</p>
        </div>
        <button class="close-button" id="close-guide" type="button" aria-label="Close guide">&times;</button>
      </div>
      <ol class="guide-list" id="guide-list"></ol>
    </dialog>

    <script src="https://unpkg.com/@rive-app/canvas@2.24.0/rive.js"></script>
    <script>
      const emotions = [
        { title: "Welcome Smile", description: "Use when the user enters the spelling activity. The mascot welcomes the player with a warm, friendly smile." },
        { title: "First Word Correct", description: "Use when the player spells the very first word correctly." },
        { title: "Correct Answer", description: "Use whenever the player gives a correct answer." },
        { title: "Struggling With Multiple Attempts", description: "Use after 3–4 attempts, when the player may need help. Gently suggest using the Slow Hint." },
        { title: "Repeated Mistakes", description: "Use when the player makes multiple mistakes or needs more than two attempts to spell the word correctly." },
        { title: "3-Word Streak", description: "Use when the player gets three words correct in a row." },
        { title: "Longer Word Challenge", description: "Use when the player is presented with a longer or more difficult word." },
        { title: "Encouragement After a Broken Streak · Part 1", description: "Use after a streak is broken. Encourage the player to refocus and start building the streak again. This animation needs a variation." },
        { title: "Streak Lost", description: "Use immediately when the player loses their current streak." },
        { title: "Encouragement After a Broken Streak · Part 2", description: "Use as another variation after a broken streak to motivate the player to regain focus and continue. This animation needs a variation." },
        { title: "Visible Confusion", description: "Use when a player previously spelled a word correctly but now gets the same or a similar word wrong." },
        { title: "Struggles but Gets It Correct", description: "Use when the player makes one or more attempts but eventually spells the word correctly." },
        { title: "Almost a Perfect Streak", description: "Use when the player has spelled six words correctly in a row and is close to a perfect streak." },
        { title: "Solves a Difficult / Long Word", description: "Use when the player successfully spells a longer or more difficult word." },
        { title: "Idle for a Long Time · 1", description: "Use when the player has not interacted with the spelling activity for a while." },
        { title: "Misses a Word", description: "Use when the player spells a word incorrectly." },
        { title: "Easy Word Offered", description: "Use when the app offers an easier word, especially after the player has been struggling." },
        { title: "Another Missed Word", description: "Use as an alternative reaction when the player spells a word incorrectly." },
        { title: "Multiple Major Mistakes", description: "Use after several incorrect attempts on one word. Keep the reaction playful rather than discouraging." },
        { title: "Perfect Performance / On Fire", description: "Use when the player is performing extremely well and continuously answering correctly." },
        { title: "Correct Answer Variation", description: "Use as an alternative positive animation after a correct spelling." },
        { title: "Saves the Streak at the Last Moment", description: "Use when the player is close to losing a streak but spells the word correctly at the last moment." },
        { title: "5-Word Streak", description: "Use when the player gets five words correct in a row." },
        { title: "Misses a Word Variation", description: "Use as another animation variation when the player spells a word incorrectly." },
        { title: "On Track for a Perfect Score", description: "Use when the player is doing very well and is close to completing the activity with a perfect score." },
        { title: "Correct Answer Variation", description: "Use as another positive animation after a correct spelling." },
        { title: "Mixed Performance", description: "Use when the player has a mixture of correct and incorrect answers during the session." },
        { title: "Correct Answer Variation", description: "Use as another animation variation for a correctly spelled word." },
        { title: "Encouraging the Slow Hint", description: "Use when the player appears to be struggling and encourage them to use the Slow Hint." },
        { title: "Correct Answer Variation", description: "Use as another celebratory animation when the player gives a correct answer." },
        { title: "Idle for a Long Time · 2", description: "Use as a second idle animation when the player has been inactive for a longer period." },
        { title: "Two Correct in a Row", description: "Use when the player spells two consecutive words correctly." },
        { title: "Misses an Easy Word", description: "Use after an unexpected miss on an easy word. Show playful surprise without making the player feel bad." },
        { title: "Continuously Missing Words", description: "Use when the player repeatedly struggles to spell several words correctly." },
        { title: "Taking a Long Time to Type", description: "Use when the player spends a long time typing or thinking about the spelling." },
        { title: "Shocked by a Major Spelling Mistake", description: "Use when an important letter or major part of the word is missing. React with playful shock." },
        { title: "Saves the Streak at the Last Moment · Part 2", description: "Use as a second variation when the player saves their streak at the last moment." },
        { title: "Continuously Missing Words · Variation", description: "Use as another variation when the player continues to struggle with multiple words in a row." },
      ];

      const canvas = document.querySelector("#mascot");
      const controls = document.querySelector("#emotion-controls");
      const detailTitle = document.querySelector("#detail-title");
      const detailDescription = document.querySelector("#detail-description");
      const usageGuide = document.querySelector("#usage-guide");
      const guideList = document.querySelector("#guide-list");
      const status = document.querySelector("#status");
      const positionButtons = Array.from(document.querySelectorAll("[data-direction]"));
      const stateMachineName = "State Machine 1";
      const idleEmotionValue = 67;
      const movementStep = 24;
      let mascot;
      let emotionInput;
      let startEmotionTimer;
      let loadVersion = 0;
      let mascotX = 0;
      let mascotY = 0;

      const moveMascot = (direction) => {
        if (direction === "up") mascotY -= movementStep;
        if (direction === "down") mascotY += movementStep;
        if (direction === "left") mascotX -= movementStep;
        if (direction === "right") mascotX += movementStep;

        canvas.style.setProperty("--mascot-x", `${mascotX}px`);
        canvas.style.setProperty("--mascot-y", `${mascotY}px`);
      };

      emotions.forEach((emotion, index) => {
        const number = index + 1;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "emotion-button";
        button.dataset.emotion = number;
        button.setAttribute("aria-pressed", "false");
        if (number >= 33) button.dataset.new = "true";
        button.innerHTML = `<span class="emotion-number">Emotion ${number}</span><span class="emotion-name">${emotion.title}</span>`;
        controls.append(button);

        const guideItem = document.createElement("li");
        guideItem.className = "guide-item";
        guideItem.innerHTML = `<strong>Emotion ${number} · ${emotion.title}</strong><span>${emotion.description}</span>`;
        guideList.append(guideItem);
      });

      const buttons = Array.from(document.querySelectorAll("[data-emotion]"));

      const showEmotionDetails = (value) => {
        const emotion = emotions[value - 1];
        if (!emotion) return;
        detailTitle.textContent = `Emotion ${value} · ${emotion.title}`;
        detailDescription.textContent = emotion.description;
      };

      const setButtonsEnabled = (enabled) => {
        buttons.forEach((button) => {
          button.disabled = !enabled;
        });
      };

      setButtonsEnabled(false);

      const setActiveButton = (value) => {
        buttons.forEach((button) => {
          button.setAttribute("aria-pressed", button.dataset.emotion === String(value));
        });
      };

      const loadMascot = (emotionToPlay = idleEmotionValue) => {
        const version = ++loadVersion;
        clearTimeout(startEmotionTimer);
        emotionInput = undefined;
        setButtonsEnabled(false);

        if (mascot) {
          mascot.cleanup();
        }

        const context = canvas.getContext("2d");
        context.clearRect(0, 0, canvas.width, canvas.height);

        mascot = new rive.Rive({
          src: "og_donk.riv",
          canvas,
          autoplay: true,
          stateMachines: stateMachineName,
          layout: new rive.Layout({
            fit: rive.Fit.Contain,
            alignment: rive.Alignment.Center,
          }),
          onLoad: () => {
            if (version !== loadVersion) {
              return;
            }

            mascot.resizeDrawingSurfaceToCanvas();
            const inputs = mascot.stateMachineInputs(stateMachineName);
            emotionInput = inputs.find((input) => input.name === "emotion");

            if (!emotionInput) {
              status.textContent = 'Could not find an input named "emotion".';
              return;
            }

            emotionInput.value = idleEmotionValue;
            setButtonsEnabled(true);

            if (emotionToPlay === idleEmotionValue) {
              setActiveButton(0);
              status.textContent = "Idle";
              return;
            }

            setActiveButton(emotionToPlay);
            status.textContent = `Showing emotion ${emotionToPlay}`;
            startEmotionTimer = setTimeout(() => {
              if (version === loadVersion) {
                emotionInput.value = idleEmotionValue;
              }
            }, 80);
            startEmotionTimer = setTimeout(() => {
              if (version === loadVersion) {
                emotionInput.value = emotionToPlay;
              }
            }, 180);
          },
          onLoadError: () => {
            if (version === loadVersion) {
              status.textContent = "Could not load og_donk.riv.";
            }
          },
        });
      };

      const setEmotion = (value) => {
        if (!emotionInput) {
          status.textContent = "Emotion input is not ready yet.";
          return;
        }

        setActiveButton(value);
        showEmotionDetails(value);
        status.textContent = `Loading emotion ${value}`;
        loadMascot(value);
      };

      loadMascot();

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          setEmotion(Number(button.dataset.emotion));
        });
      });

      positionButtons.forEach((button) => {
        button.addEventListener("click", () => {
          moveMascot(button.dataset.direction);
        });
      });

      document.querySelector("#open-guide").addEventListener("click", () => {
        usageGuide.showModal();
      });

      document.querySelector("#close-guide").addEventListener("click", () => {
        usageGuide.close();
      });

      usageGuide.addEventListener("click", (event) => {
        if (event.target === usageGuide) usageGuide.close();
      });

      window.addEventListener("resize", () => {
        if (mascot) {
          mascot.resizeDrawingSurfaceToCanvas();
        }
      });
    </script>
  </body>
</html>
