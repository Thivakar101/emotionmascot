<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emotion Mascot</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1b1b23;
        --muted: #666978;
        --panel: #ffffff;
        --line: #dfe3ea;
        --accent: #246bfe;
        --accent-ink: #ffffff;
        --page: #f3f5f8;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
      }

      body {
        margin: 0;
        height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.8), transparent 44%),
          var(--page);
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden; /* page itself never scrolls */
      }

      main {
        width: min(100%, 1180px);
        height: min(100%, 760px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        grid-template-rows: minmax(0, 1fr);
        gap: 18px;
        min-height: 0;
      }

      .stage {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        box-shadow: 0 18px 50px rgba(35, 43, 70, 0.12);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .panel {
        min-height: 0;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .controls {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        display: grid;
        grid-template-columns: 1fr;
        align-content: start;
        gap: 10px;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      button {
        appearance: none;
        position: relative;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
        color: var(--ink);
        min-height: 48px;
        padding: 0 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 160ms ease,
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      button:hover,
      button:focus-visible {
        border-color: var(--accent);
        outline: none;
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
        transform: none;
      }

      button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      button[data-new="true"]::after {
        content: "NEW";
        position: absolute;
        top: -9px;
        right: 12px;
        min-width: 38px;
        padding: 3px 7px;
        border-radius: 999px;
        background: #ffcf33;
        color: #2a2100;
        font-size: 11px;
        font-weight: 900;
        line-height: 1;
        box-shadow: 0 5px 14px rgba(79, 61, 0, 0.18);
        transform: scale(0.92);
        transform-origin: center;
        transition: transform 160ms ease;
      }

      button[data-new="true"]:hover::after,
      button[data-new="true"]:focus-visible::after {
        transform: scale(1);
      }

      .status {
        min-height: 20px;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        flex: 0 0 auto;
      }

      @media (max-width: 640px) {
        body {
          padding: 14px;
        }

        main {
          height: 100%;
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) minmax(190px, 38vh);
        }

        .stage {
          min-height: 0;
        }

        canvas {
          height: 100%;
        }

        .controls {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 641px) and (max-width: 900px) {
        main {
          grid-template-columns: minmax(0, 1fr) 280px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="stage" aria-label="Mascot preview">
        <canvas id="mascot" width="1200" height="800"></canvas>
      </section>

      <div class="panel">
        <section class="controls" aria-label="Emotion controls">
          <button type="button" data-emotion="1" aria-pressed="false">Emotion 1</button>
          <button type="button" data-emotion="2" aria-pressed="false">Emotion 2</button>
          <button type="button" data-emotion="3" aria-pressed="false">Emotion 3</button>
          <button type="button" data-emotion="4" aria-pressed="false">Emotion 4</button>
          <button type="button" data-emotion="5" aria-pressed="false">Emotion 5</button>
          <button type="button" data-emotion="6" aria-pressed="false">Emotion 6</button>
          <button type="button" data-emotion="7" aria-pressed="false">Emotion 7</button>
          <button type="button" data-emotion="8" aria-pressed="false">Emotion 8</button>
          <button type="button" data-emotion="9" aria-pressed="false">Emotion 9</button>
          <button type="button" data-emotion="10" aria-pressed="false">Emotion 10</button>
          <button type="button" data-emotion="11" aria-pressed="false">Emotion 11</button>
          <button type="button" data-emotion="12" aria-pressed="false">Emotion 12</button>
          <button type="button" data-emotion="13" aria-pressed="false">Emotion 13</button>
          <button type="button" data-emotion="14" aria-pressed="false">Emotion 14</button>
          <button type="button" data-emotion="15" aria-pressed="false">Emotion 15</button>
          <button type="button" data-emotion="16" aria-pressed="false">Emotion 16</button>
          <button type="button" data-emotion="17" aria-pressed="false">Emotion 17</button>
          <button type="button" data-emotion="18" aria-pressed="false">Emotion 18</button>
          <button type="button" data-emotion="19" aria-pressed="false">Emotion 19</button>
          <button type="button" data-emotion="20" aria-pressed="false">Emotion 20</button>
          <button type="button" data-emotion="21" aria-pressed="false">Emotion 21</button>
          <button type="button" data-emotion="22" aria-pressed="false">Emotion 22</button>
          <button type="button" data-emotion="23" aria-pressed="false">Emotion 23</button>
          <button type="button" data-emotion="24" aria-pressed="false">Emotion 24</button>
          <button type="button" data-emotion="25" aria-pressed="false">Emotion 25</button>
          <button type="button" data-emotion="26" aria-pressed="false">Emotion 26</button>
          <button type="button" data-emotion="27" aria-pressed="false">Emotion 27</button>
          <button type="button" data-emotion="28" aria-pressed="false">Emotion 28</button>
          <button type="button" data-emotion="29" aria-pressed="false">Emotion 29</button>
          <button type="button" data-emotion="30" aria-pressed="false">Emotion 30</button>
          <button type="button" data-emotion="31" aria-pressed="false">Emotion 31</button>
          <button type="button" data-emotion="32" aria-pressed="false">Emotion 32</button>
          <button type="button" data-emotion="33" data-new="true" aria-pressed="false">Emotion 33</button>
          <button type="button" data-emotion="34" data-new="true" aria-pressed="false">Emotion 34</button>
          <button type="button" data-emotion="35" data-new="true" aria-pressed="false">Emotion 35</button>
          <button type="button" data-emotion="36" data-new="true" aria-pressed="false">Emotion 36</button>
          <button type="button" data-emotion="37" data-new="true" aria-pressed="false">Emotion 37</button>
          <button type="button" data-emotion="38" data-new="true" aria-pressed="false">Emotion 38</button>
        </section>

        <div class="status" id="status" role="status">Loading mascot...</div>
      </div>
    </main>

    <script src="https://unpkg.com/@rive-app/canvas@2.24.0/rive.js"></script>
    <script>
      const canvas = document.querySelector("#mascot");
      const buttons = Array.from(document.querySelectorAll("[data-emotion]"));
      const status = document.querySelector("#status");
      const stateMachineName = "State Machine 1";
      const idleEmotionValue = 67;
      let mascot;
      let emotionInput;
      let startEmotionTimer;
      let loadVersion = 0;

      const setButtonsEnabled = (enabled) => {
        buttons.forEach((button) => {
          button.disabled = !enabled;
        });
      };

      setButtonsEnabled(false);

      const setActiveButton = (value) => {
        buttons.forEach((button) => {
          button.setAttribute("aria-pressed", button.dataset.emotion === String(value));
        });
      };

      const loadMascot = (emotionToPlay = idleEmotionValue) => {
        const version = ++loadVersion;
        clearTimeout(startEmotionTimer);
        emotionInput = undefined;
        setButtonsEnabled(false);

        if (mascot) {
          mascot.cleanup();
        }

        const context = canvas.getContext("2d");
        context.clearRect(0, 0, canvas.width, canvas.height);

        mascot = new rive.Rive({
          src: "og_donk.riv",
          canvas,
          autoplay: true,
          stateMachines: stateMachineName,
          layout: new rive.Layout({
            fit: rive.Fit.Contain,
            alignment: rive.Alignment.Center,
          }),
          onLoad: () => {
            if (version !== loadVersion) {
              return;
            }

            mascot.resizeDrawingSurfaceToCanvas();
            const inputs = mascot.stateMachineInputs(stateMachineName);
            emotionInput = inputs.find((input) => input.name === "emotion");

            if (!emotionInput) {
              status.textContent = 'Could not find an input named "emotion".';
              return;
            }

            emotionInput.value = idleEmotionValue;
            setButtonsEnabled(true);

            if (emotionToPlay === idleEmotionValue) {
              setActiveButton(0);
              status.textContent = "Idle";
              return;
            }

            setActiveButton(emotionToPlay);
            status.textContent = `Showing emotion ${emotionToPlay}`;
            startEmotionTimer = setTimeout(() => {
              if (version === loadVersion) {
                emotionInput.value = idleEmotionValue;
              }
            }, 80);
            startEmotionTimer = setTimeout(() => {
              if (version === loadVersion) {
                emotionInput.value = emotionToPlay;
              }
            }, 180);
          },
          onLoadError: () => {
            if (version === loadVersion) {
              status.textContent = "Could not load og_donk.riv.";
            }
          },
        });
      };

      const setEmotion = (value) => {
        if (!emotionInput) {
          status.textContent = "Emotion input is not ready yet.";
          return;
        }

        setActiveButton(value);
        status.textContent = `Loading emotion ${value}`;
        loadMascot(value);
      };

      loadMascot();

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          setEmotion(Number(button.dataset.emotion));
        });
      });

      window.addEventListener("resize", () => {
        if (mascot) {
          mascot.resizeDrawingSurfaceToCanvas();
        }
      });
    </script>
  </body>
</html>
